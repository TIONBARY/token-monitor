name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name ClaudeTokenMonitor --clean main.py

      - name: Generate SHA256 checksum
        run: |
          $hash = (Get-FileHash dist\ClaudeTokenMonitor.exe -Algorithm SHA256).Hash
          "$hash *ClaudeTokenMonitor.exe" | Out-File -FilePath dist\ClaudeTokenMonitor.exe.sha256 -Encoding ascii -NoNewline

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeTokenMonitor.exe
            dist/ClaudeTokenMonitor.exe.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
